<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dragon Multiplier Rush 🐉🍀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 900px;
      background: #0f172a;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* UI Overlays */
    .overlay-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(10px);
      padding: 24px;
      text-align: center;
      z-index: 10;
      transition: opacity 0.25s ease;
    }

    .hidden {
      display: none !important;
    }

    .badge {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-weight: 800;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .title {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.1;
      background: linear-gradient(135deg, #ffffff, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      max-width: 320px;
    }

    .primary-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      padding: 16px 40px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .primary-btn:active {
      transform: scale(0.96);
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 10px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hud-val {
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-box">
        <span class="hud-label">DRAGON SQUAD</span>
        <span id="hud-squad" class="hud-val">1 🐉</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">SCORE</span>
        <span id="hud-score" class="hud-val">0000</span>
      </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay-screen">
      <div class="badge">MULTIPLIER RUNNER SHOOTER</div>
      <h1 class="title">DRAGON<br>MULTIPLIER RUSH</h1>
      <p class="subtitle">Drag to move • Fireballs auto-shoot • Shoot gates to boost your squad • Blast leprechauns!</p>
      <button id="start-btn" class="primary-btn">TAP TO START ▶</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay-screen hidden">
      <div class="badge" style="background: linear-gradient(135deg, #ef4444, #dc2626);">GAME OVER</div>
      <h1 class="title" style="background: linear-gradient(135deg, #ffffff, #f87171); -webkit-background-clip: text;">SQUAD ELIMINATED</h1>
      <p id="final-score-text" class="subtitle">Final Score: 0</p>
      <button id="restart-btn" class="primary-btn" style="background: linear-gradient(135deg, #10b981, #059669);">RESTART ▶</button>
    </div>
  </div>

  <script>
    /**
     * DRAGON MULTIPLIER RUSH - Standalone Senior Game Developer Implementation
     */

    // --- 1. FIREBALL CLASS ---
    class Fireball {
      constructor(x, y, radius = 6, speed = 14) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.speed = speed;
        this.active = true;
      }

      update(dt) {
        this.y -= this.speed * (dt * 60);
        if (this.y < -20) this.active = false;
      }

      draw(ctx) {
        ctx.save();
        ctx.fillStyle = '#f97316';
        ctx.shadowColor = '#f97316';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- 2. DRAGON SQUAD CLASS ---
    class DragonSquad {
      constructor(canvasWidth, canvasHeight) {
        this.canvasWidth = canvasWidth;
        this.canvasHeight = canvasHeight;
        this.x = canvasWidth / 2;
        this.targetX = canvasWidth / 2;
        this.y = canvasHeight - 140;
        this.radius = 24;
        this.squadSize = 1;

        this.fireballs = [];
        this.shootTimer = 0;
      }

      resize(width, height) {
        this.canvasWidth = width;
        this.canvasHeight = height;
        this.y = height - 140;
      }

      setTargetX(mouseX) {
        // Bound movement inside track limits
        const margin = 50;
        this.targetX = Math.max(margin, Math.min(this.canvasWidth - margin, mouseX));
      }

      update(dt) {
        // Smooth horizontal steering
        this.x += (this.targetX - this.x) * 0.25;

        // Auto Fireball Stream (Fire rate scales up with squad size)
        this.shootTimer += dt;
        const cooldown = Math.max(0.12, 0.35 - (Math.min(10, this.squadSize) * 0.02));
        
        if (this.shootTimer > cooldown) {
          this.shootTimer = 0;
          
          // Main dragon fires
          this.fireballs.push(new Fireball(this.x, this.y - 20));

          // Clones shoot
          const clonesToShoot = Math.min(6, this.squadSize - 1);
          for (let i = 0; i < clonesToShoot; i++) {
            const angle = ((i / clonesToShoot) * Math.PI) - (Math.PI / 2);
            const offsetX = Math.cos(angle) * 32;
            this.fireballs.push(new Fireball(this.x + offsetX, this.y - 10, 5, 13));
          }
        }

        // Update Fireballs
        for (let i = this.fireballs.length - 1; i >= 0; i--) {
          const fb = this.fireballs[i];
          fb.update(dt);
          if (!fb.active) this.fireballs.splice(i, 1);
        }
      }

      draw(ctx) {
        if (this.squadSize <= 0) return;

        ctx.save();

        // 1. Draw Squad Clones Trailing Main Dragon
        const numClones = Math.min(18, this.squadSize - 1);
        for (let i = 0; i < numClones; i++) {
          const distance = 36 + Math.floor(i / 5) * 20;
          const angle = (i * 0.95) + (Date.now() * 0.003);
          const cx = this.x + Math.cos(angle) * distance;
          const cy = this.y + Math.sin(angle) * (distance * 0.45);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.fillStyle = '#10b981';
          ctx.beginPath();
          ctx.arc(0, 0, 10, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#047857';
          ctx.fillRect(-14, -4, 28, 4);
          ctx.restore();
        }

        // 2. Draw Main Lead Dragon
        ctx.save();
        ctx.translate(this.x, this.y);

        // Wings
        ctx.fillStyle = '#047857';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-45, -30, -65, 10);
        ctx.quadraticCurveTo(-40, 30, 0, 0);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(45, -30, 65, 10);
        ctx.quadraticCurveTo(40, 30, 0, 0);
        ctx.fill();

        // Dragon Head Body
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Snout
        ctx.fillStyle = '#065f46';
        ctx.beginPath();
        ctx.roundRect(-10, -30, 20, 18, 4);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(-8, -12, 4, 0, Math.PI * 2);
        ctx.arc(8, -12, 4, 0, Math.PI * 2);
        ctx.fill();

        // Squad Counter Badge
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#60a5fa';
        ctx.font = '800 12px Outfit';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.squadSize.toString(), 0, 1);

        ctx.restore();

        // Draw Fireballs
        for (const fb of this.fireballs) fb.draw(ctx);

        ctx.restore();
      }
    }

    // --- 3. DYNAMIC MULTIPLIER GATE PAIR CLASS ---
    class GatePair {
      constructor(canvasWidth, y = -100) {
        this.canvasWidth = canvasWidth;
        this.y = y;
        this.height = 54;
        this.active = true;

        const roadX = 40;
        const roadWidth = canvasWidth - 80;
        const halfWidth = roadWidth / 2;

        // Generate Math Operators (+5, x2, -3, ÷2)
        const ops = ['+', 'x', '-', '÷'];

        // Left Gate
        const op1 = ops[Math.floor(Math.random() * ops.length)];
        const val1 = (op1 === 'x' || op1 === '÷') ? (Math.floor(Math.random() * 2) + 2) : (Math.floor(Math.random() * 8) + 2);
        
        // Right Gate
        const op2 = ops[Math.floor(Math.random() * ops.length)];
        const val2 = (op2 === 'x' || op2 === '÷') ? (Math.floor(Math.random() * 2) + 2) : (Math.floor(Math.random() * 8) + 2);

        this.leftGate = {
          x: roadX + halfWidth / 2,
          width: halfWidth - 10,
          op: op1,
          val: val1,
          isPositive: op1 === '+' || op1 === 'x'
        };

        this.rightGate = {
          x: roadX + halfWidth + halfWidth / 2,
          width: halfWidth - 10,
          op: op2,
          val: val2,
          isPositive: op2 === '+' || op2 === 'x'
        };
      }

      update(speed, dt) {
        this.y += speed * (dt * 60);
      }

      // Shooting a gate increases its value dynamically!
      hitGate(gate) {
        if (gate.op === '+' || gate.op === 'x') {
          gate.val += 1;
        } else if (gate.op === '-') {
          gate.val -= 1;
          if (gate.val <= 0) {
            gate.op = '+';
            gate.val = Math.abs(gate.val) + 1;
            gate.isPositive = true;
          }
        } else if (gate.op === '÷') {
          gate.val -= 1;
          if (gate.val <= 1) {
            gate.op = 'x';
            gate.val = 2;
            gate.isPositive = true;
          }
        }
      }

      applyMath(gate, squadSize) {
        if (gate.op === '+') return squadSize + gate.val;
        if (gate.op === 'x') return squadSize * gate.val;
        if (gate.op === '-') return Math.max(0, squadSize - gate.val);
        if (gate.op === '÷') return Math.max(0, Math.floor(squadSize / gate.val));
        return squadSize;
      }

      draw(ctx) {
        ctx.save();
        for (const gate of [this.leftGate, this.rightGate]) {
          ctx.save();
          ctx.translate(gate.x, this.y);

          const color = gate.isPositive ? '#10b981' : '#ef4444';
          const label = `${gate.op}${gate.val}`;

          // Gate Fill
          ctx.fillStyle = gate.isPositive ? 'rgba(16, 185, 129, 0.35)' : 'rgba(239, 68, 68, 0.4)';
          ctx.strokeStyle = color;
          ctx.lineWidth = 3.5;

          ctx.beginPath();
          ctx.roundRect(-gate.width / 2, -this.height / 2, gate.width, this.height, 12);
          ctx.fill();
          ctx.stroke();

          // Gate Label
          ctx.fillStyle = '#ffffff';
          ctx.font = '800 22px Outfit';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, 0, -2);

          // Sub-hint
          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.font = '700 9px Outfit';
          ctx.fillText('SHOOT TO BOOST 🎯', 0, 16);

          ctx.restore();
        }
        ctx.restore();
      }
    }

    // --- 4. LEPRECHAUN ENEMY CLASS ---
    class Leprechaun {
      constructor(canvasWidth, y = -60) {
        this.canvasWidth = canvasWidth;
        const roadX = 40;
        const roadWidth = canvasWidth - 80;
        
        this.x = roadX + Math.random() * roadWidth;
        this.y = y;
        this.radius = 18;
        this.hp = Math.floor(Math.random() * 20) + 10; // e.g. HP: 10 to 30
        this.maxHp = this.hp;
        this.active = true;
      }

      update(speed, dt) {
        this.y += (speed * 0.9) * (dt * 60);
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Leprechaun Body
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Hat
        ctx.fillStyle = '#166534';
        ctx.fillRect(-14, -22, 28, 5);
        ctx.fillRect(-9, -36, 18, 14);

        // Buckle
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(-3, -26, 6, 6);

        // HP Badge Label
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.roundRect(-20, -48, 40, 14, 4);
        ctx.fill();

        ctx.fillStyle = '#ef4444';
        ctx.font = '800 10px Outfit';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`HP: ${this.hp}`, 0, -41);

        ctx.restore();
      }
    }

    // --- 5. GAME ENGINE ---
    class GameEngine {
      constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');

        this.state = 'START'; // START, RUNNING, GAMEOVER
        this.speed = 4.5;
        this.score = 0;

        this.dragonSquad = new DragonSquad(this.canvas.width, this.canvas.height);
        this.gatePairs = [];
        this.leprechauns = [];

        this.gateTimer = 0;
        this.enemyTimer = 0;
        this.lastTime = 0;

        this.initEvents();
        this.resize();
      }

      resize() {
        const container = document.getElementById('game-container');
        this.width = container.clientWidth;
        this.height = container.clientHeight;

        this.canvas.width = this.width;
        this.canvas.height = this.height;

        this.dragonSquad.resize(this.width, this.height);
      }

      initEvents() {
        window.addEventListener('resize', () => this.resize());

        // Mouse / Touch Dragging Steering Controls
        const handleMove = (e) => {
          if (this.state !== 'RUNNING') return;
          const rect = this.canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const mouseX = clientX - rect.left;
          this.dragonSquad.setTargetX(mouseX);
        };

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, { passive: true });

        document.getElementById('start-btn').onclick = () => this.startGame();
        document.getElementById('restart-btn').onclick = () => this.startGame();
      }

      startGame() {
        this.state = 'RUNNING';
        this.speed = 4.5;
        this.score = 0;

        this.dragonSquad = new DragonSquad(this.width, this.height);
        this.gatePairs = [];
        this.leprechauns = [];
        this.gateTimer = 0;
        this.enemyTimer = 0;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('gameover-screen').classList.add('hidden');

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
      }

      gameOver() {
        this.state = 'GAMEOVER';
        document.getElementById('final-score-text').innerText = `Final Score: ${Math.round(this.score)}`;
        document.getElementById('gameover-screen').classList.remove('hidden');
      }

      update(dt) {
        if (this.state !== 'RUNNING') return;

        this.score += dt * 25;
        this.dragonSquad.update(dt);

        // Spawn Multiplier Gate Pairs
        this.gateTimer += dt;
        if (this.gateTimer > 4.2) {
          this.gateTimer = 0;
          this.gatePairs.push(new GatePair(this.width));
        }

        // Spawn Leprechaun Hordes
        this.enemyTimer += dt;
        if (this.enemyTimer > 1.2) {
          this.enemyTimer = 0;
          for (let i = 0; i < 2; i++) {
            this.leprechauns.push(new Leprechaun(this.width, -60 - (i * 40)));
          }
        }

        // Update Gate Pairs & Collision
        for (let i = this.gatePairs.length - 1; i >= 0; i--) {
          const pair = this.gatePairs[i];
          pair.update(this.speed, dt);

          // Check Fireball hits on Gates -> Dynamic Multiplier Increase!
          for (const gate of [pair.leftGate, pair.rightGate]) {
            for (let j = this.dragonSquad.fireballs.length - 1; j >= 0; j--) {
              const fb = this.dragonSquad.fireballs[j];
              if (Math.abs(fb.x - gate.x) < gate.width / 2 && Math.abs(fb.y - pair.y) < pair.height / 2) {
                this.dragonSquad.fireballs.splice(j, 1);
                pair.hitGate(gate);
              }
            }
          }

          // Check Dragon Collision with Gate
          if (Math.abs(pair.y - this.dragonSquad.y) < pair.height / 2 + 10) {
            const hitGate = (this.dragonSquad.x < this.width / 2) ? pair.leftGate : pair.rightGate;
            this.dragonSquad.squadSize = pair.applyMath(hitGate, this.dragonSquad.squadSize);
            this.gatePairs.splice(i, 1);

            if (this.dragonSquad.squadSize < 1) {
              this.gameOver();
              return;
            }
            continue;
          }

          if (pair.y > this.height + 100) {
            this.gatePairs.splice(i, 1);
          }
        }

        // Update Leprechauns & Collision
        for (let i = this.leprechauns.length - 1; i >= 0; i--) {
          const lep = this.leprechauns[i];
          lep.update(this.speed, dt);

          // Fireball hits on Leprechaun
          for (let j = this.dragonSquad.fireballs.length - 1; j >= 0; j--) {
            const fb = this.dragonSquad.fireballs[j];
            if (Math.hypot(fb.x - lep.x, fb.y - lep.y) < lep.radius + fb.radius) {
              this.dragonSquad.fireballs.splice(j, 1);
              lep.hp -= 10;
              if (lep.hp <= 0) {
                this.score += 150;
                this.leprechauns.splice(i, 1);
                break;
              }
            }
          }

          // Leprechaun reaches Dragon -> 1:1 Squad Reduction!
          if (Math.hypot(lep.x - this.dragonSquad.x, lep.y - this.dragonSquad.y) < lep.radius + this.dragonSquad.radius) {
            this.dragonSquad.squadSize -= 1;
            this.leprechauns.splice(i, 1);

            if (this.dragonSquad.squadSize < 1) {
              this.gameOver();
              return;
            }
          }
        }

        // Update HUD
        document.getElementById('hud-squad').innerText = `${this.dragonSquad.squadSize} 🐉`;
        document.getElementById('hud-score').innerText = Math.round(this.score).toString().padStart(4, '0');
      }

      draw() {
        this.ctx.clearRect(0, 0, this.width, this.height);

        // Road Highway Background
        this.ctx.fillStyle = '#0f172a';
        this.ctx.fillRect(0, 0, this.width, this.height);

        const roadX = 40;
        const roadWidth = this.width - 80;
        this.ctx.fillStyle = '#1e293b';
        this.ctx.fillRect(roadX, 0, roadWidth, this.height);

        // Center Line
        this.ctx.strokeStyle = '#38bdf8';
        this.ctx.lineWidth = 4;
        this.ctx.setLineDash([30, 30]);
        this.ctx.beginPath();
        this.ctx.moveTo(this.width / 2, 0);
        this.ctx.lineTo(this.width / 2, this.height);
        this.ctx.stroke();
        this.ctx.setLineDash([]);

        // Render Entities
        for (const pair of this.gatePairs) pair.draw(this.ctx);
        for (const lep of this.leprechauns) lep.draw(this.ctx);
        this.dragonSquad.draw(this.ctx);
      }

      loop(timestamp) {
        if (this.state !== 'RUNNING') return;
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;

        this.update(dt);
        this.draw();

        requestAnimationFrame((t) => this.loop(t));
      }
    }

    // Initialize Game Engine on Load
    window.addEventListener('DOMContentLoaded', () => {
      window.gameEngine = new GameEngine();
    });
  </script>
</body>
</html>
